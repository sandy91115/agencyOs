services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: agencyos
            POSTGRES_USER: agencyos
            POSTGRES_PASSWORD: agencyos-local-only
        ports:
            - '55432:5432'
        volumes:
            - agencyos-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U agencyos -d agencyos']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '56379:6379'
        volumes:
            - agencyos-redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

volumes:
    agencyos-postgres:
    agencyos-redis:
